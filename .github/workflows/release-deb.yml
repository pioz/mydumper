name: Build release deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload the deb for'
        required: true

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    env:
      DISTRO: noble
      ARCH: amd64
    steps:
      - name: Resolve tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libglib2.0-dev libmariadb-dev libmariadb-dev-compat libpcre2-dev libssl-dev zlib1g-dev fakeroot

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Smoke test
        run: |
          build/mydumper --version
          build/myloader --version

      - name: Package deb
        run: |
          source VERSION
          PKGVER="${ver}"
          PKGREV="${rev}"
          ROOT="pkg/mydumper_${PKGVER}"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/etc"
          cp package/deb/control "$ROOT/DEBIAN/control"
          sed -i "s/%{version}/${PKGVER}-${PKGREV}/" "$ROOT/DEBIAN/control"
          sed -i "s/%{distro}/${DISTRO}/" "$ROOT/DEBIAN/control"
          sed -i "s/%{architecture}/${ARCH}/" "$ROOT/DEBIAN/control"
          sed -i "s/^Pre-Depends: .*/&, libmariadb3, zlib1g, libssl3t64/" "$ROOT/DEBIAN/control"
          install -m 0555 build/mydumper build/myloader "$ROOT/usr/bin/"
          install -m 0664 mydumper.cnf "$ROOT/etc/"
          cd pkg
          fakeroot dpkg-deb -Zxz --build "mydumper_${PKGVER}"
          mv "mydumper_${PKGVER}.deb" "../mydumper_${PKGVER}-${PKGREV}.${DISTRO}_${ARCH}.deb"
          cd ..
          dpkg -I mydumper_*.deb

      - name: Install and test packaged binary
        run: |
          sudo dpkg -i mydumper_*.deb
          mydumper --version
          myloader --version

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" mydumper_*.deb --clobber --repo "$GITHUB_REPOSITORY"
